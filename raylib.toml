# raylib_cmake_template — what the BUILD needs to know.
#
# Deliberately short, and it stays short. Anything you can set with a raylib
# call belongs in your code, not here: the window size and its title are
# arguments to InitWindow(), so that is where they live. What is left is the
# handful of things CMake has to know before your code exists.
#
# Delete this file and the build still works, on defaults, with a warning.

[project]
# Binary name and CMake target. Letters, digits, `_` and `-` only.
name = "game"

[raylib]
# Modules you do not use, to shrink the library. `rcore` and `rlgl` are
# mandatory and are not listed on purpose.
#   rshapes | rtextures | rtext | rmodels | raudio
disabled_modules = []

[linux]
# backend  "glfw" (default) or "rgfw". RGFW is smaller and younger, and on Linux
#          it is X11-ONLY — it cannot be combined with wayland = false.
# wayland  false builds GLFW against X11, so on a Wayland desktop you run
#          through XWayland. true builds GLFW's native Wayland backend and needs
#          libwayland-dev, wayland-protocols and libxkbcommon-dev.
#          Note: Wayland has no window position, by design. GetWindowPosition()
#          and SetWindowPosition() do not work there.
backend = "glfw"
wayland = false

[windows]
# "glfw" (default), "win32" (raylib's native Win32 backend, no GLFW at all) or
# "rgfw". The two alternatives are smaller and younger: gamepads, multi-monitor
# and the clipboard are thinner. Fine for a simple game, wrong as a default.
backend = "glfw"

[dev]
# Local development only — the `debug` preset. `release` and `web` are
# unaffected by anything in this section.
# clang | gcc | mingw | msvc | default
#
# mingw looks for x86_64-w64-mingw32-gcc before plain `gcc`, which is what makes
# it work from MSYS2. Both mingw and msvc refuse to run off Windows.
compiler = "default"
linker   = "auto"    # auto | mold | lld | default
#
# WHAT EACH ONE CAN ACTUALLY DO, because "faster linker" is not the whole story:
#
#   auto     try the fast ones, keep the first that LINKS, fall back to the
#            system one. It never fails a build — it is a speed setting, and a
#            speed setting that can stop a build is worse than a slow build.
#   mold     Linux and the BSDs only. mold emits ELF and nothing else; run
#            `mold --help` and the list is elf32-i386, elf64-x86-64 and so on,
#            with no PE/COFF and no Mach-O. Asking for it on Windows or macOS
#            is refused here rather than at the linker, which used to fail with
#            a message about `ld` that never said the word mold.
#   lld      everywhere, IF the toolchain can reach it. GCC's -fuse-ld=lld wants
#            an `ld.lld` on PATH and not just `lld`, and MSYS2 ships one without
#            the other — so the build checks by linking a test program instead
#            of trusting that the binary exists.
#   default  whatever the platform uses. On macOS that is Apple's ld, which is
#            already fast, so this is what `auto` settles on there.
